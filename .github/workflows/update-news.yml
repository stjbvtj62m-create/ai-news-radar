name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,12 * * *" # 每天北京时间 08:00 和 20:00 自动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24

      # --- 修改逻辑：移除摘要，增加时间和来源 ---
      - name: Prepare Notifications
        id: prep
        env:
          PAGE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: |
          python - <<EOF
          import json
          import os

          def run():
              json_path = 'data/latest-24h.json'
              if not os.path.exists(json_path):
                  with open('mail_body.html', 'w') as f: f.write("暂无更新内容")
                  with open('feishu_card.json', 'w') as f: json.dump({}, f)
                  return

              with open(json_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              # 自动提取列表逻辑
              items = []
              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict):
                  items = data.get('news') or data.get('items') or data.get('data') or list(data.values())[0]
              
              page_url = os.environ.get('PAGE_URL', '')

              # 1. 构建 HTML 邮件 (取前 20 条，显示 来源 和 时间)
              html = f"<h2>🚀 AI 新闻雷达摘要</h2><p>访问 <a href='{page_url}'>在线页面</a> 查看更多</p><hr/>"
              for item in items[:20]:
                  title = item.get('title_zh') or item.get('title', '无标题')
                  source = item.get('source', '聚合源')
                  time_str = item.get('time', '')
                  url = item.get('url', '#')
                  
                  # 移除 summary，仅展示 标题 + 来源 + 时间
                  html += f"<div style='margin-bottom:15px;'>"
                  html += f"  <h3 style='margin:0;'><a href='{url}'>{title}</a></h3>"
                  html += f"  <p style='color:#888; font-size:12px; margin-top:5px;'>来源：{source} | 时间：{time_str}</p>"
                  html += f"</div>"
              
              with open('mail_body.html', 'w', encoding='utf-8') as f:
                  f.write(html)

              # 2. 构建飞书卡片 (取前 10 条，展示 来源 和 时间)
              card_elements = []
              for item in items[:10]:
                  t = item.get('title_zh') or item.get('title', '无标题')
                  src = item.get('source', '聚合源')
                  tm = item.get('time', '')
                  u = item.get('url', '#')
                  # 飞书 Markdown 格式
                  card_elements.append({
                      "tag": "div",
                      "text": {
                          "tag": "lark_md",
                          "content": f"**[{t}]({u})**\n🕒 {tm}  |  📍 {src}"
                      }
                  })
                  card_elements.append({"tag": "hr"})
              
              card = {
                  "msg_type": "interactive",
                  "card": {
                      "config": {"wide_screen_mode": True},
                      "header": {"title": {"tag": "plain_text", "content": "🔥 AI 新闻快讯 (无摘要版)"}, "template": "orange"},
                      "elements": card_elements + [{"tag": "note", "elements": [{"tag": "plain_text", "content": f"查看完整版: {page_url}"}]}]
                  }
              }
              with open('feishu_card.json', 'w', encoding='utf-8') as f:
                  json.dump(card, f, ensure_ascii=False)

          run()
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update news data [skip ci]" || echo "No changes to commit"
          git push

      # --- 飞书发送 (使用 FEISHU_WEBHOOK_URL) ---
      - name: Feishu Notification
        env:
          FEISHU_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        if: success() && env.FEISHU_URL != ''
        run: |
          curl -X POST -H "Content-Type: application/json" -d @feishu_card.json $FEISHU_URL

      # --- 邮件发送 ---
      - name: Send Mail Notification
        env:
          SENDER: ${{ secrets.EMAIL_SENDER }}
        if: success() && env.SENDER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_HOST }}
          server_port: ${{ secrets.EMAIL_PORT || 465 }}
          username: ${{ secrets.EMAIL_SENDER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "【实时更新】AI 新闻快讯"
          to: ${{ secrets.EMAIL_RECEIVER || secrets.EMAIL_SENDER }}
          from: "AI News Radar <${{ secrets.EMAIL_SENDER }}>"
          html_body: file://mail_body.html
