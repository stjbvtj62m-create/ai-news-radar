name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24

      # --- 健壮的内容生成脚本 ---
      - name: Prepare Notifications
        id: prep
        env:
          PAGE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: |
          python - <<EOF
          import json
          import os

          def run():
              json_path = 'data/latest-24h.json'
              if not os.path.exists(json_path):
                  print(f"File not found: {json_path}")
                  return

              with open(json_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              # 核心修复：自动识别数据结构
              # 如果 data 是字典，尝试获取里面的列表内容
              items = []
              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict):
                  # 尝试常见的 key，或者取第一个是列表的 value
                  items = data.get('news') or data.get('items') or data.get('data')
                  if not items:
                      for val in data.values():
                          if isinstance(val, list):
                              items = val
                              break
              
              if not items:
                  print("Could not find a list of news items in JSON")
                  items = []

              page_url = os.environ.get('PAGE_URL', '')

              # 1. 构建 HTML 邮件 (取前 15 条)
              html = f"<h2>🚀 AI 新闻雷达摘要</h2><p>更多内容请访问 <a href='{page_url}'>在线页面</a></p><hr/>"
              for item in items[:15]:
                  title = item.get('title_zh') or item.get('title', '无标题')
                  summary = item.get('summary', '暂无摘要')
                  url = item.get('url', '#')
                  html += f"<div style='margin-bottom:20px;'><h3><a href='{url}'>{title}</a></h3>"
                  html += f"<p style='color:#555;'>{summary}</p></div>"
              
              with open('mail_body.html', 'w', encoding='utf-8') as f:
                  f.write(html)

              # 2. 构建飞书卡片 (取前 8 条)
              card_elements = []
              for item in items[:8]:
                  t = item.get('title_zh') or item.get('title', '无标题')
                  s = item.get('summary', '暂无摘要')
                  u = item.get('url', '#')
                  card_elements.append({"tag": "div", "text": {"tag": "lark_md", "content": f"**[{t}]({u})**\n{s}"}})
                  card_elements.append({"tag": "hr"})
              
              card = {
                  "msg_type": "interactive",
                  "card": {
                      "config": {"wide_screen_mode": True},
                      "header": {"title": {"tag": "plain_text", "content": "🔥 AI 新闻雷达快讯"}, "template": "blue"},
                      "elements": card_elements + [{"tag": "note", "elements": [{"tag": "plain_text", "content": f"🔗 完整版地址: {page_url}"}]}]
                  }
              }
              with open('feishu_card.json', 'w', encoding='utf-8') as f:
                  json.dump(card, f, ensure_ascii=False)

          run()
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update news data [skip ci]" || echo "No changes to commit"
          git push

      # --- 飞书发送 (使用 FEISHU_URL 参数) ---
      - name: Feishu Notification
        env:
          FEISHU_URL: ${{ secrets.FEISHU_WEBHOOK }}
        if: success() && env.FEISHU_URL != ''
        run: |
          curl -X POST -H "Content-Type: application/json" -d @feishu_card.json $FEISHU_URL

      # --- 邮件发送 ---
      - name: Send Mail Notification
        env:
          SENDER: ${{ secrets.EMAIL_SENDER }}
        if: success() && env.SENDER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_HOST }}
          server_port: ${{ secrets.EMAIL_PORT || 465 }}
          username: ${{ secrets.EMAIL_SENDER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "【精选】AI 新闻雷达快讯"
          to: ${{ secrets.EMAIL_RECEIVER || secrets.EMAIL_SENDER }}
          from: "AI News Radar <${{ secrets.EMAIL_SENDER }}>"
          html_body: file://mail_body.html
