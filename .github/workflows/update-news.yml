name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *" # 每小时运行一次

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 1. 下载代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 4. 运行抓取脚本
      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24

      # 5. 提交数据到仓库
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update news data [skip ci]" || echo "No changes to commit"
          git push

      # 6. 飞书通知 (修复了 secrets 报错问题)
      - name: Feishu Notification
        env:
          FEISHU_URL: ${{ secrets.FEISHU_WEBHOOK }}
        if: success() && env.FEISHU_URL != ''
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{
            "msg_type": "text",
            "content": {
              "text": "📢 AI 新闻雷达已更新！\n🔗 访问地址: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            }
          }' \
          $FEISHU_URL

      # 7. 邮件通知 (修复了 secrets 报错问题)
      - name: Send Mail Notification
        env:
          MAIL_USER: ${{ secrets.EMAIL_USER }}
        if: success() && env.MAIL_USER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_HOST }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "AI News Radar 自动更新成功"
          to: ${{ secrets.EMAIL_RECEIVER }}
          from: "AI News Radar <${{ secrets.EMAIL_USER }}>"
          body: "AI 新闻雷达已成功更新。点击查看最新资讯: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
