name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *" # 每小时运行一次

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 1. 下载代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 4. 运行抓取脚本
      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24

      # 【新增步骤】：提取 JSON 内容生成邮件 HTML 模板
      - name: Generate Mail Content
        id: mail_content
        run: |
          python - <<EOF
          import json
          import os

          try:
              # 读取生成的最新 24 小时新闻
              with open('data/latest-24h.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              # 构建 HTML 字符串
              html = "<h2>🚀 AI 新闻雷达摘要</h2>"
              html += "<p>以下是过去 24 小时的精选内容，点击标题可跳转原文：</p><hr/>"
              
              # 只取前 15 条，防止邮件过长
              for item in data[:15]:
                  title = item.get('title', '无标题')
                  url = item.get('url', '#')
                  summary = item.get('summary', '暂无 AI 摘要')
                  # 处理可能存在的翻译
                  title_zh = item.get('title_zh', '')
                  display_title = title_zh if title_zh else title
                  
                  html += f"<div style='margin-bottom: 20px;'>"
                  html += f"  <h3 style='margin-bottom: 5px;'><a href='{url}'>{display_title}</a></h3>"
                  html += f"  <p style='color: #666; font-size: 14px;'>{summary}</p>"
                  html += f"</div>"
              
              html += "<hr/><p>🔗 查看完整版: <a href='https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/'>在线雷达页面</a></p>"
              
              # 将 HTML 写入文件
              with open('mail_body.html', 'w', encoding='utf-8') as f:
                  f.write(html)
          except Exception as e:
              with open('mail_body.html', 'w', encoding='utf-8') as f:
                  f.write(f"提取内容失败，请查看在线链接。错误: {str(e)}")
          EOF

      # 5. 提交数据到仓库
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update news data [skip ci]" || echo "No changes to commit"
          git push

      # 6. 飞书通知 (修复了 secrets 报错问题)
      - name: Feishu Notification
        env:
          FEISHU_URL: ${{ SECRETS.FEISHU_WEBHOOK_URL }}
        if: success() && env.FEISHU_URL != ''
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{
            "msg_type": "text",
            "content": {
              "text": "📢 AI 新闻雷达已更新！\n🔗 访问地址: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            }
          }' \
          $FEISHU_URL

      # 7. 邮件通知 (修复了 secrets 报错问题)
      - name: Send Mail Notification
        env:
          MAIL_USER: ${{ SECRETS.EMAIL_SENDER }}
        if: success() && env.MAIL_USER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ SECRETS.EMAIL_HOST }}
          server_port: ${{ SECRETS.EMAIL_PORT }}
          username: ${{ SECRETS.EMAIL_SENDER }}
          password: ${{ SECRETS.EMAIL_PASSWORD }}
          subject: "AI News Radar 自动更新成功"
          to: ${{ SECRETS.EMAIL_RECEIVER }}
          from: "AI News Radar <${{ SECRETS.EMAIL_SENDER }}>"
          body: "AI 新闻雷达已成功更新。点击查看最新资讯: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
