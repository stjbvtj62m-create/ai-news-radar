name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3,12 * * *" # 北京时间 08:00 和 20:00

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24

      # --- 深度时间探测与格式化脚本 ---
      - name: Prepare Notifications
        id: prep
        env:
          PAGE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: |
          python - <<EOF
          import json
          import os
          import re
          from datetime import datetime

          def format_time(item):
              # 1. 定义所有可能的键名（按优先级排序）
              possible_keys = ['pubDate', 'date', 'updated_at', 'created_at', 'published', 'time', 'timestamp', 'dt']
              raw_val = None
              
              for k in possible_keys:
                  if item.get(k):
                      raw_val = item.get(k)
                      break
              
              # 2. 如果没找到显式键名，尝试遍历所有值，寻找符合日期格式的字符串
              if not raw_val:
                  for v in item.values():
                      if isinstance(v, str) and re.search(r'\d{4}[-/]\d{1,2}[-/]\d{1,2}', v):
                          raw_val = v
                          break

              # 3. 如果还是没有，默认使用当前抓取时间（防止显示“近期”）
              if not raw_val:
                  return datetime.now().strftime("%Y-%m-%d %H:%M:%S")

              # 4. 格式化处理
              try:
                  # 处理时间戳 (int 或 float)
                  if isinstance(raw_val, (int, float)):
                      if raw_val > 10**10: raw_val /= 1000 # 毫秒转秒
                      return datetime.fromtimestamp(raw_val).strftime("%Y-%m-%d %H:%M:%S")

                  # 处理字符串
                  s = str(raw_val).strip()
                  # 清洗常见干扰字符
                  s = s.replace('T', ' ').replace('Z', '').split('+')[0].split('.')[0]
                  
                  # 如果是 ITHome 等常见的 Wed, 26 Feb 2026 格式，尝试截取
                  if ',' in s and len(s) > 15:
                      return s # 保持原样输出，通常已包含精确时间
                  
                  # 强制补全 YYYY-MM-DD HH:MM:SS
                  if len(s) == 10: s += " 00:00:00"
                  if len(s) >= 19: return s[:19]
                  
                  return s
              except:
                  return str(raw_val)

          def run():
              json_path = 'data/latest-24h.json'
              if not os.path.exists(json_path): return
              with open(json_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              items = []
              if isinstance(data, list): items = data
              elif isinstance(data, dict):
                  items = data.get('news') or data.get('items') or data.get('data') or list(data.values())[0]
              
              page_url = os.environ.get('PAGE_URL', '')

              # 1. 邮件 (取前 20 条)
              html = f"<h2>🚀 AI 新闻雷达摘要</h2><p>点击标题跳转原文，更多内容见 <a href='{page_url}'>在线页面</a></p><hr/>"
              for item in items[:20]:
                  title = item.get('title_zh') or item.get('title', '无标题')
                  source = item.get('source', '聚合源')
                  tm = format_time(item)
                  u = item.get('url', '#')
                  html += f"<div style='margin-bottom:15px;'><h3><a href='{u}'>{title}</a></h3>"
                  html += f"<p style='color:#888; font-size:12px;'>来源：{source} | 时间：{tm}</p></div>"
              with open('mail_body.html', 'w', encoding='utf-8') as f: f.write(html)

              # 2. 飞书卡片 (取前 10 条)
              elements = []
              for item in items[:10]:
                  t = item.get('title_zh') or item.get('title', '无标题')
                  src = item.get('source', '聚合源')
                  tm = format_time(item)
                  u = item.get('url', '#')
                  elements.append({
                      "tag": "div",
                      "text": {"tag": "lark_md", "content": f"**[{t}]({u})**\n🕒 {tm}  |  📍 {src}"}
                  })
                  elements.append({"tag": "hr"})
              
              card = {
                  "msg_type": "interactive",
                  "card": {
                      "config": {"wide_screen_mode": True},
                      "header": {"title": {"tag": "plain_text", "content": "🔥 AI 新闻快讯"}, "template": "orange"},
                      "elements": elements + [
                          {"tag": "note", "elements": [{"tag": "lark_md", "content": f"🔗 [查看完整版页面]({page_url})"}]}
                      ]
                  }
              }
              with open('feishu_card.json', 'w', encoding='utf-8') as f:
                  json.dump(card, f, ensure_ascii=False)

          run()
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update news data [skip ci]" || echo "No changes to commit"
          git push

      - name: Feishu Notification
        env:
          FEISHU_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        if: success() && env.FEISHU_URL != ''
        run: |
          curl -X POST -H "Content-Type: application/json" -d @feishu_card.json $FEISHU_URL

      - name: Send Mail Notification
        env:
          SENDER: ${{ secrets.EMAIL_SENDER }}
        if: success() && env.SENDER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_HOST }}
          server_port: ${{ secrets.EMAIL_PORT || 465 }}
          username: ${{ secrets.EMAIL_SENDER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "【实时更新】AI 新闻雷达"
          to: ${{ secrets.EMAIL_RECEIVER || secrets.EMAIL_SENDER }}
          from: "AI News Radar <${{ secrets.EMAIL_SENDER }}>"
          html_body: file://mail_body.html
